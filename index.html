/* Layout: one phone-width column; a colored "prompt card" on top, big tap targets below. Same palette as Nadav's worksheets. */
:root{

    --green:#62d69d; --green-t:#173d2b; --purple:#b9a2ff; --purple-t:#2e2552;
    --pink:#ff8dbb; --pink-t:#46203a; --teal:#5fd0de; --teal-t:#143c44;

  --blue:#86b3ff; --blue-t:#1f2f5e; --orange:#ff9d66; --orange-t:#43261a;

.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--ct);border-radius:26px;min-height:178px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 5px 0 var(--shadow);transition:transform .1s}

.tile .tt{font-size:22px;font-weight:800}

.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ghost{border:2px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:16px;color:var(--muted);min-height:48px}
.note{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:12px 16px;font-size:15px;line-height:1.45;color:var(--muted)}

.q{margin:0;text-align:center;font-size:24px;font-weight:800;line-height:1.35;text-wrap:balance}

.opt.pics2{font-size:38px;letter-spacing:-2px;flex-direction:row;flex-wrap:wrap}
.sentence{margin:0;font-size:32px;line-height:1.7;font-weight:800;text-align:center;text-wrap:balance;padding:10px 44px 0}

.opt.picopt{font-size:62px;line-height:1.1}
.opt .w{font-size:20px;font-weight:700}

.opt .lbl{font-size:26px;font-weight:800}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}

.labword{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700}
.labword .pic{font-size:48px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:6px}

.seg button svg{width:30px;height:30px;color:var(--orange)}
.seg button[aria-pressed="true"]{background:var(--purple);color:var(--on-accent)}

.kb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.key{min-height:58px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);font-size:30px;font-weight:800;line-height:1}
.key[aria-pressed="true"]{background:var(--purple-t);border-color:var(--purple)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:22px}
.panel p{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.warn{color:var(--orange)!important;font-weight:600}
.small{flex:1;min-height:50px;border-radius:16px;border:2px solid var(--line);font-size:17px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}

.sheet{width:100%;max-width:400px;background:var(--card);border-radius:30px;padding:24px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 12px 0 var(--shadow);animation:pop .3s}

.sheet h2{margin:0;font-size:30px;font-weight:800}
.sheet p{margin:0;font-size:18px;color:var(--muted)}
.sheet .btn{width:100%;flex:none}
.btn.stay{background:var(--green);border-color:var(--green);color:var(--on-accent);min-height:68px;font-size:24px}

  .sheet{animation:none}
  .opt.no,.ok{animation:none}

  .tile,.opt{transition:none}
}

var UNIT=/[א-ת][֑-ׇ]*/g;

  var b=lettersOf(u);

  return b+d+v;
}
function variantOf(u){
  var b=u[0],marks=u.slice(1),cands=[];
  if(/[ַָ]/.test(marks))cands.push(b+marks.replace(/[ַָ]/,'ְ'));
  else if(marks.indexOf('ְ')>-1)cands.push(b+marks.replace('ְ','ַ'));
  var base=lettersOf(b);
  if(byL[base]){
    var sims=[];
    SIM.forEach(function(g){if(g.indexOf(base)>-1)g.forEach(function(l){if(l!==base&&sims.indexOf(l)<0)sims.push(l);});});
    if(sims.length){
      var nl=pick(sims),nm=marks;
      if(nm.indexOf('ּ')>-1&&'בגדכפת'.indexOf(nl)<0)nm=nm.replace('ּ','');
      if(nl!=='ש')nm=nm.replace(/[ׁׂ]/g,'');
      cands.push(nl+nm);
    }

}

  var units=unitsOf(w.w),keys=units.map(keyOf),extra=[],n=units.length>=4?2:1,tries=0;

    var k=keyOf(v);
    if(keys.indexOf(k)>-1||extra.some(function(e){return keyOf(e)===k;}))continue;
    extra.push(v);
  }
  var tiles=shuffle(units.concat(extra)).map(function(u){return {u:u,k:keyOf(u),used:false};});
  return {w:w,units:units,tiles:tiles,pos:0};
}

    seq.forEach(function(n){
      var o=actx.createOscillator(),g=actx.createGain();

      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(actx.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.05);
    });
  }catch(e){}
}

/* game logic */
function pool(){
  var p=L.filter(function(x){return S.enabled.indexOf(x.l)>-1;});
  return p.length>=4?p:L;
}
function wpool(multi){
  var all=WORDS.filter(function(w){return !multi||w.rest;});
  var p=all.filter(function(w){return lettersOf(w.w).split('').every(function(ch){return S.enabled.indexOf(ch)>-1;});});
  return p.length>=4?p:all;
}
/* 3 wrong answers, look-alike letters first */
function distractors(t,n){
  var p=pool(),out=[];
  SIM.forEach(function(g){
    if(g.indexOf(t.l)>-1)g.forEach(function(l){var o=byL[l];if(o&&o!==t&&p.indexOf(o)>-1&&out.indexOf(o)<0)out.push(o);});
  });
  out=shuffle(out);
  shuffle(p).concat(shuffle(L)).forEach(function(x){if(x!==t&&out.indexOf(x)<0)out.push(x);});
  return out.slice(0,n);
}
function wordDistractors(w){
  var cands=shuffle(wpool(false).filter(function(x){return x!==w;}));
  if(cands.length<3)cands=shuffle(WORDS.filter(function(x){return x!==w;}));
  var f=lettersOf(w.w);
  function score(x){var g=lettersOf(x.w),s=0;if(g[0]===f[0])s+=2;if(g.length===f.length)s+=1;return s;}
  cands.sort(function(a,b){return score(b)-score(a);});
  return cands.slice(0,3);
}

function makeQ(){

    c={t:x,v:v,opts:shuffle([{t:x,v:v}].concat(distractors(x,3).map(function(d,i){return {t:d,v:others[i%2]};})))};
  }else if(m==='build'){
    c=makeBuild(x);
  }else if(m==='sent'){
    c={s:x,ans:x[1],opts:shuffle([x[1],x[2],x[3]])};
  }else if(m==='words'){
    c={w:x,opts:shuffle([x].concat(wordDistractors(x)))};

    prompt='<div class="pic" role="img" aria-label="תמונה">'+c.t.pic+'</div>';
    q='בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה?';cols=2;
    opts=c.opts.map(function(o,i){return '<button class="opt letter heb" data-act="ans" data-i="'+i+'" aria-label="'+o.name+'">'+o.l+'</button>';}).join('');
  }else if(S.mode==='niqqud'){
    var nm=VNAME[c.v];
    prompt='<div class="markbig">'+markSvg(c.v)+'</div><div class="word heb">'+nm+'</div>';
    q=VQ[c.v];cols=2;
    opts=c.opts.map(function(o,i){return '<button class="opt sylopt heb" data-act="ans" data-i="'+i+'">'+syl(o.t,o.v)+'</button>';}).join('');
    tip='<p class="tip heb">פַּתָּח הוּא קַו. קָמָץ הוּא קַו עִם רֶגֶל.<br>שְׁוָא הוּא שְׁתֵּי נְקֻדּוֹת זוֹ מֵעַל זוֹ</p>';
  }else if(S.mode==='build'){
    var slots='';
    for(var s=0;s<c.units.length;s++)slots+='<span class="slot'+(s<c.pos?' filled':s===c.pos?' now':'')+'" data-s="'+s+'">'+(s<c.pos?c.units[s]:'')+'</span>';
    prompt='<div class="pic" aria-hidden="true">'+c.w.pic+'</div><div class="slots heb">'+slots+'</div>';
    q='בּוֹנִים אֶת הַמִּלָּה!';cols='p';
    opts=c.tiles.map(function(t,i){return '<button class="piece heb'+(t.used?' used':'')+'" data-act="piece" data-i="'+i+'"'+(t.used?' disabled':'')+'>'+t.u+'</button>';}).join('');
    tip='<p class="tip heb">לוֹחֲצִים עַל הַחֲלָקִים לְפִי הַסֵּדֶר, מִיָּמִין לִשְׂמֹאל. יֵשׁ גַּם חֲלָקִים מְיֻתָּרִים!</p>';
  }else if(S.mode==='sent'){
    prompt='<p class="sentence heb">'+c.s[0]+'</p>';
    q='אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּשְׁפָּט?';cols=3;
    opts=c.opts.map(function(o,i){return '<button class="opt picopt pics2" data-act="ans" data-i="'+i+'" aria-label="תמונה '+(i+1)+'"><span aria-hidden="true">'+o+'</span></button>';}).join('');
  }else if(S.mode==='words'){
    prompt='<div class="pic" aria-hidden="true">'+c.w.pic+'</div>';
    q='אֵיזוֹ מִלָּה מַתְאִימָה לַתְּמוּנָה?';cols=2;
    opts=c.opts.map(function(o,i){return '<button class="opt wordopt heb" data-act="ans" data-i="'+i+'">'+o.w+'</button>';}).join('');
  }else if(S.mode==='missing'){
    prompt='<div class="pic" aria-hidden="true">'+c.w.pic+'</div><div class="word heb"><span class="blank">?</span>'+c.w.rest+'</div>';
    q='אֵיזוֹ הֲבָרָה חֲסֵרָה?';cols=2;
    opts=c.opts.map(function(o,i){return '<button class="opt sylopt heb" data-act="ans" data-i="'+i+'">'+syl(o.t,o.v)+'</button>';}).join('');
  }else{
    prompt='<div class="big heb">'+syl(c.t,c.v)+'</div>';
    q='אֵיזוֹ תְּמוּנָה מַתְחִילָה כָּךְ?';cols=2;
    opts=c.opts.map(function(o,i){return '<button class="opt picopt" data-act="ans" data-i="'+i+'" aria-label="'+o.word+'"><span aria-hidden="true">'+o.pic+'</span></button>';}).join('');
  }
  var dots='';for(var i=0;i<ROUND;i++)dots+='<span class="dot'+(i<S.q?' done':i===S.q?' now':'')+'"></span>';
  return '<div class="bar t-'+m.c+'"><button class="round" data-act="home" aria-label="לדף הבית">'+HOME+'</button>'+
    '<div class="dots" aria-label="שאלה '+(S.q+1)+' מתוך '+ROUND+'">'+dots+'</div>'+
    '<div class="pill" aria-label="כוכבים בסיבוב">'+STAR+'<b>'+S.stars+'</b></div></div>'+
    '<section class="prompt t-'+m.c+'">'+prompt+'<button class="round say" data-act="say" aria-label="להקשיב">'+SPK+'</button></section>'+
    '<h2 class="q heb">'+q+'</h2>'+
    '<div class="opts c'+cols+'">'+opts+'</div>'+tip+
    '<p class="fb heb" id="fb" aria-live="polite"></p>';
}
function renderEnd(){
  var colors=['var(--blue)','var(--orange)','var(--green)','var(--purple)','var(--star)'],conf='';
  for(var i=0;i<40;i++){
    conf+='<span style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+pick(colors)+';animation-duration:'+(2.2+Math.random()*1.6).toFixed(2)+'s;animation-delay:'+(Math.random()*.8).toFixed(2)+'s"></span>';
  }
  var st='';for(var j=0;j<ROUND;j++)st+=j<S.stars?STAR:STAR_EMPTY;
  return '<div class="confetti" aria-hidden="true">'+conf+'</div>'+
    '<section class="end"><h1 class="heb">כָּל הַכָּבוֹד, שָׁקֵד!</h1>'+
    '<div class="stars" aria-label="'+S.stars+' כוכבים מתוך '+ROUND+'">'+st+'</div>'+
    '<p class="score heb">'+S.stars+' כּוֹכָבִים מִתּוֹךְ '+ROUND+'</p>'+
    '<div class="row"><button class="btn primary heb" data-act="again">עוֹד פַּעַם</button><button class="btn heb" data-act="home">הַבַּיְתָה</button></div></section>';
}
function renderLab(){
  var t=L[S.labI],v=S.labV;
  var seg=[['','בְּלִי'],[PAT,'פַּתָּח'],[KAM,'קָמָץ'],[SHVA,'שְׁוָא']].map(function(s){
    return '<button class="heb" data-act="lab-v" data-v="'+(s[0]===PAT?'p':s[0]===KAM?'k':s[0]===SHVA?'s':'n')+'" aria-pressed="'+(v===s[0])+'">'+s[1]+'</button>';
  }).join('');
  var keys=L.map(function(x,i){return '<button class="key heb" data-act="lab-letter" data-i="'+i+'" aria-pressed="'+(i===S.labI)+'" aria-label="'+x.name+'">'+syl(x,v)+'</button>';}).join('');
  return '<div class="bar"><button class="round" data-act="home" aria-label="לדף הבית">'+HOME+'</button><h2 class="bt heb">מַעְבָּדָה</h2><span style="width:52px"></span></div>'+
    '<section class="prompt t-purple"><div class="big heb">'+syl(t,v)+'</div>'+
    '<div class="labword"><span class="pic" aria-hidden="true">'+t.pic+'</span><span class="heb">'+t.word+'</span></div>'+
    '<button class="round say" data-act="lab-say" aria-label="להקשיב">'+SPK+'</button></section>'+
    '<div class="seg seg4">'+seg+'</div>'+
    '<p class="tip heb">לוֹחֲצִים עַל אוֹת וְשׁוֹמְעִים. פַּתָּח וְקָמָץ אוֹמְרִים <b>אַ</b></p>'+
    '<div class="kb">'+keys+'</div>';
}
function renderSettings(){
  var keys=L.map(function(x){return '<button class="key heb" data-act="toggle" data-l="'+x.l+'" aria-pressed="'+(S.enabled.indexOf(x.l)>-1)+'">'+x.l+'</button>';}).join('');
  var few=S.enabled.length<3;
  var vb=[['auto','אוטומטי'],['he','עברית'],['en','אנגלית']].map(function(o){return '<button data-act="voice" data-v="'+o[0]+'" aria-pressed="'+(S.voice===o[0])+'">'+o[1]+'</button>';}).join('');
  return '<div class="bar"><button class="round" data-act="home" aria-label="לדף הבית">'+HOME+'</button><h2 class="bt">למבוגרים</h2><span style="width:52px"></span></div>'+
    '<section class="panel"><h3>שפת הקול</h3>'+
    '<p>אין קול בעברית? בוחרים <b>אנגלית</b>. המשחק יקריא את האותיות, ההברות והמילים בקול האנגלי של המכשיר, כך שיישמעו כמו בעברית (למשל בָּ יישמע "bah").</p>'+
    '<div class="seg">'+vb+'</div>'+
    '<div class="row"><button class="small" data-act="test">בדיקת קול: בַּנָּנָה</button></div></section>'+
    '<section class="panel"><h3>אילו אותיות כבר למדו בכיתה?</h3>'+
    '<p>המשחקים ישתמשו רק באותיות המסומנות. אפשר להוסיף אותיות בכל פעם שלומדים אות חדשה.</p>'+
    '<div class="kb">'+keys+'</div>'+
    (few?'<p class="warn">צריך לפחות 3 אותיות. עד אז המשחק ישתמש בכל האותיות.</p>':'<p>מסומנות '+S.enabled.length+' אותיות מתוך 22.</p>')+
    '<div class="row"><button class="small" data-act="all">כל האותיות</button><button class="small" data-act="none">ניקוי</button></div></section>'+
    '<section class="panel"><h3>טיפים</h3>'+
    '<p>כפתור הרמקול משמיע את המילה או את הצליל. הקול מגיע מהטלפון עצמו, ולכן הוא נשמע קצת אחרת בכל מכשיר.</p>'+
    '<p>כוכב מתקבל על תשובה נכונה בניסיון הראשון. הכוכבים נשמרים בטלפון הזה.</p></section>'+
    '<section class="panel"><h3>אין קול בעברית? כך מסדרים</h3>'+
    '<p><b>באייפון:</b></p><ol class="steps"><li>פותחים <b>הגדרות</b> ← <b>נגישות</b> ← <b>תוכן מוקרא</b> ← <b>קולות</b>.</li><li>בוחרים <b>עברית</b> ומורידים את הקול (למשל כרמית).</li><li>סוגרים את האפליקציה לגמרי ופותחים את המשחק מחדש.</li></ol>'+
    '<p><b>באנדרואיד:</b></p><ol class="steps"><li>פותחים <b>הגדרות</b> ומחפשים בחיפוש <b>טקסט לדיבור</b>.</li><li>בוחרים במנוע של <b>Google</b>, נכנסים להגדרות שלו (גלגל השיניים) ← <b>התקנת נתוני קול</b>.</li><li>מורידים <b>עברית</b>, ופותחים את המשחק מחדש.</li></ol>'+
    '<p>עדיין אין קול? פותחים את הקישור בדפדפן (Safari או Chrome) במקום באפליקציה.</p></section>';
}
var $app=document.getElementById('app');
function render(){
  var f={home:renderHome,game:renderGame,end:renderEnd,lab:renderLab,settings:renderSettings}[S.screen];
  $app.innerHTML=f();
}
function go(screen){S.screen=screen;render();window.scrollTo(0,0);}

$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='mode'){var m=b.dataset.mode;if(m==='lab'){go('lab');}else{startMode(m);window.scrollTo(0,0);}}
  else if(a==='home'){
    if(S.screen==='game'){showConfirm();}
    else if(S.screen==='end'){leaveGame();}
    else{try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(err){}go('home');}
  }
  else if(a==='stay'){hideConfirm();}
  else if(a==='leave'){leaveGame();}
  else if(a==='ans'){if(document.getElementById('exitModal'))return;answer(+b.dataset.i,b);}
  else if(a==='piece'){if(document.getElementById('exitModal'))return;tapPiece(+b.dataset.i,b);}
  else if(a==='say'){sayPrompt();}
  else if(a==='again'){startMode(S.mode);window.scrollTo(0,0);}
  else if(a==='sound'){S.sound=!S.sound;save('sound',S.sound);render();if(S.sound)tone(GOOD);}
  else if(a==='settings'){go('settings');}
  else if(a==='voice'){S.voice=b.dataset.v;save('voice',S.voice);render();speak('בַּנָּנָה');}
  else if(a==='test'){speak('בַּנָּנָה');}
  else if(a==='lab-letter'){S.labI=+b.dataset.i;render();speak(soundOf(L[S.labI],S.labV));}
  else if(a==='lab-v'){S.labV={p:PAT,k:KAM,s:SHVA,n:''}[b.dataset.v];render();speak(soundOf(L[S.labI],S.labV));}
  else if(a==='lab-say'){speak(soundOf(L[S.labI],S.labV));}
  else if(a==='toggle'){var l=b.dataset.l,ix=S.enabled.indexOf(l);if(ix>-1)S.enabled.splice(ix,1);else S.enabled.push(l);save('letters',S.enabled);render();}
  else if(a==='all'){S.enabled=L.map(function(x){return x.l;});save('letters',S.enabled);render();}
  else if(a==='none'){S.enabled=[];save('letters',S.enabled);render();}
});
render();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
